version: "3.8"

services:
  amu-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amu-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
    env_file:
      - .env
    volumes:
      # Persist logs outside container
      - ./logs:/app/logs:Z
      # Mount service account (read-only for security)
      - ./service_account.json:/app/service_account.json:ro,Z
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - amu-network

networks:
  amu-network:
    driver: bridge
